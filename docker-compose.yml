name: neurostream

services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: neurostream-kafka
    ports:
      - "29092:29092" # host access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: neurostream-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic neuro-raw-signals --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic neuro-dead-letter --partitions 1 --replication-factor 1
        echo "topics ready"

  ml-server:
    build:
      context: .
      dockerfile: services/ml-server/Dockerfile
    container_name: neurostream-ml-server
    environment:
      GRPC_PORT: "50051"
      MAX_WORKERS: "4"
      TORCH_NUM_THREADS: "2"
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD", "python", "-m", "app.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ingestion-gateway:
    build:
      context: services/ingestion-gateway
    container_name: neurostream-gateway
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      PORT: "3000"
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: neuro-raw-signals
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    container_name: neurostream-worker
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      ml-server:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKA_TOPIC: neuro-raw-signals
      KAFKA_DLQ_TOPIC: neuro-dead-letter
      KAFKA_GROUP_ID: neuro-preprocessing-workers
      INFERENCE_TARGET: ml-server:50051
      BATCH_MAX_SIZE: "8"
      BATCH_MAX_WAIT_MS: "500"
      SAMPLING_RATE_HZ: "173.61"
      PYTHONUNBUFFERED: "1"
