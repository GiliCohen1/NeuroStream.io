name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Worker unit tests
        run: |
          pip install numpy scipy pytest
          cd services/worker && python -m pytest tests -q
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/ingestion-gateway/package-lock.json
      - name: Gateway tests (DTO + HTTP e2e with fake Kafka) and build
        working-directory: services/ingestion-gateway
        run: |
          npm ci
          npm test
          npm run build

  e2e:
    # Real stack: Kafka (KRaft) + NestJS gateway + Python worker + gRPC ML server, all in Docker.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install e2e client deps
        run: pip install numpy requests
      - name: Build images
        run: |
          set -o pipefail
          docker compose build --progress=plain 2>&1 | tee build.log
      - name: Start the stack
        run: docker compose up -d 2>&1 | tee up.log
      - name: Run end-to-end check
        run: python scripts/e2e_check.py
      - name: Surface diagnostics on failure
        # Publishes log tails as workflow annotations so failures are readable without downloading logs.
        if: failure()
        run: |
          emit() { echo "::error title=$1::$(tail -n 50 "$2" | tr -d '\r' | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          docker compose ps -a > ps.log 2>&1 || true
          docker compose logs --no-color --tail=30 > stack.log 2>&1 || true
          for f in build.log up.log ps.log stack.log; do [ -s "$f" ] && emit "$f (tail)" "$f"; done
          true
      - name: Tear down
        if: always()
        run: docker compose down -v
